name: bump-roslyn-ls

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - run: dotnet tool restore

      - name: bump the pin
        run: |
          # No stable release exists, so --prerelease is load-bearing. Exits 0 when
          # already current, which makes a quiet week a no-op rather than a red build.
          dotnet tool update roslyn-language-server --prerelease
          # dotnet tool update rewrites the manifest without a trailing newline.
          if [ -n "$(tail -c1 .config/dotnet-tools.json)" ]; then
            printf '\n' >> .config/dotnet-tools.json
          fi

      - id: pin
        run: |
          version=$(sed -n 's/.*"version": "\(5\.[^"]*\)".*/\1/p' .config/dotnet-tools.json | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: ./probes/run.sh

      - uses: peter-evans/create-pull-request@v8
        id: cpr
        with:
          # BUMP_TOKEN is optional; see the status step below for what it buys.
          token: ${{ secrets.BUMP_TOKEN || secrets.GITHUB_TOKEN }}
          title: "bump roslyn-language-server to ${{ steps.pin.outputs.version }}"
          branch: chore/bump-roslyn-ls
          commit-message: "bump roslyn-language-server to ${{ steps.pin.outputs.version }}"
          add-paths: .config/dotnet-tools.json
          body: |
            Automated weekly bump of the pinned language server.

            `probes/run.sh` passed against `${{ steps.pin.outputs.version }}` on this runner
            before the PR was opened.

      # A PR opened with GITHUB_TOKEN does not trigger workflows, so probe.yml never runs
      # on it and the PR shows no gate. Publish the probe result above as a commit status
      # instead, so the PR carries something a reviewer and branch protection can require.
      # Set a BUMP_TOKEN secret (a PAT with repo scope) to get a native probe.yml run.
      - if: steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ steps.cpr.outputs.pull-request-head-sha }}" \
            -f state=success \
            -f context=probes \
            -f description="probes passed against ${{ steps.pin.outputs.version }}" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
